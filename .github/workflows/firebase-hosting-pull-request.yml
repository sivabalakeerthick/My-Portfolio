name: Deploy to Firebase Hosting Preview (PR)

on:
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write
  deployments: write

jobs:
  build_and_preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration=production

      - name: Deploy to Firebase Hosting Preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_SIVABALAKEERTHICK || secrets.FIREBASE_SERVICE_ACCOUNT_MY_APPLICATION1_19358 }}"
          projectId: portfolio-sivabalakeerthick
          target: sivabalakeerthick
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d
          firebaseToolsVersion: "15.34.0"
