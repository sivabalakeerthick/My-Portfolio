<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="20" fill="#0b172a"/>
  <!-- Central API gateway / hub -->
  <circle cx="50" cy="50" r="14" fill="#00e5ff" fill-opacity="0.2" stroke="#00e5ff" stroke-width="3"/>
  <circle cx="50" cy="50" r="5" fill="#00e5ff"/>
  <!-- 4 Microservice satellite pods -->
  <circle cx="22" cy="24" r="11" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="2.5"/>
  <circle cx="78" cy="24" r="11" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2.5"/>
  <circle cx="22" cy="76" r="11" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="78" cy="76" r="11" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="2.5"/>
  <!-- Interconnecting buses -->
  <line x1="32" y1="32" x2="42" y2="42" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="2 2"/>
  <line x1="68" y1="32" x2="58" y2="42" stroke="#10b981" stroke-width="2.5" stroke-dasharray="2 2"/>
  <line x1="32" y1="68" x2="42" y2="58" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="2 2"/>
  <line x1="68" y1="68" x2="58" y2="58" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="2 2"/>
</svg>
