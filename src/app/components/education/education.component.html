<section class="section" id="education">
  <div class="section-header" data-aos="fade-up">
    <div class="section-eyebrow">
      <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
      <span>Academic Foundation</span>
    </div>
    <h2 class="section-title">Education</h2>
    <p class="section-subtitle">
      Academic milestones that shaped my analytical thinking and software engineering foundations.
    </p>
  </div>

  <div class="education-grid" data-aos="fade-up" data-aos-delay="100">
    <article *ngFor="let item of educationList" class="education-card glass-card">
      <div class="edu-icon-badge">
        <i [class]="item.icon || 'fa-solid fa-graduation-cap'" aria-hidden="true"></i>
      </div>
      <div class="edu-body">
        <div class="edu-top">
          <h3 class="degree-title">{{ item.degree }}</h3>
          <span class="education-year">{{ item.year }}</span>
        </div>
        <p class="institution-name">{{ item.institution }}</p>
        <div *ngIf="item.location" class="location-row">
          <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
          <span>{{ item.location }}</span>
        </div>
        <p *ngIf="item.details" class="edu-details">{{ item.details }}</p>
      </div>
    </article>
  </div>
</section>
