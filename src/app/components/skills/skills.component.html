<section class="section" id="skills">
  <div class="section-header" data-aos="fade-up">
    <div class="section-eyebrow">
      <i class="fa-solid fa-code" aria-hidden="true"></i>
      <span>Technical Arsenal</span>
    </div>
    <h2 class="section-title">Skills & Technologies</h2>
    <p class="section-subtitle">
      A comprehensive toolkit developed through enterprise software engineering, real-world system architecture, and Agentic AI workflows.
    </p>
  </div>

  <div class="skills-bento-grid" data-aos="fade-up" data-aos-delay="100">
    <div
      *ngFor="let category of categories"
      class="skill-category-card glass-card"
      [class.featured-category]="category.featured">
      <div class="category-header">
        <div class="category-icon-wrapper" [class.ai-highlight]="category.featured">
          <i [class]="category.icon" aria-hidden="true"></i>
        </div>
        <div class="category-info">
          <div class="title-row">
            <h3 class="category-heading">{{ category.title }}</h3>
            <span *ngIf="category.featured" class="specialty-badge">
              <i class="fa-solid fa-bolt" aria-hidden="true"></i> Core Specialization
            </span>
          </div>
          <span class="skill-count">{{ category.skills.length }} Technologies</span>
        </div>
      </div>

      <div class="skills-grid">
        <div *ngFor="let skill of category.skills" class="skill-item" [attr.aria-label]="skill.name">
          <div class="icon-bubble">
            <img
              [src]="skill.icon"
              [alt]="skill.name"
              [class.dark-invert]="skill.invertInDarkMode"
              class="skill-icon"
              width="40"
              height="40"
              loading="lazy" />
          </div>
          <span class="skill-name">{{ skill.name }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
