<section class="section" id="skills">
  <div class="section-header" data-aos="fade-up">
    <div class="section-eyebrow">
      <i class="fa-solid fa-code" aria-hidden="true"></i>
      <span>Technical Arsenal</span>
    </div>
    <h2 class="section-title">Skills & Technologies</h2>
    <p class="section-subtitle">
      A comprehensive toolkit developed through enterprise software engineering, real-world system architecture, and Agentic AI workflows.
    </p>
  </div>

  <!-- Interactive Category Filter Bar -->
  <div class="skills-filter-wrapper" data-aos="fade-up" data-aos-delay="50">
    <div class="skills-filter-bar">
      <button
        type="button"
        class="filter-tab"
        [class.active]="selectedCategory === 'all'"
        (click)="selectCategory('all')"
        aria-label="Show all skills">
        <i class="fa-solid fa-shapes" aria-hidden="true"></i>
        <span>All Skills</span>
      </button>

      <button
        *ngFor="let cat of categories"
        type="button"
        class="filter-tab"
        [class.active]="selectedCategory === cat.id"
        (click)="selectCategory(cat.id)"
        [attr.aria-label]="'Filter by ' + cat.title">
        <i [class]="cat.icon" aria-hidden="true"></i>
        <span>{{ cat.shortTitle || cat.title }}</span>
      </button>
    </div>
  </div>

  <!-- Skills Bento Grid -->
  <div
    class="skills-bento-grid"
    [class.is-single-filtered]="selectedCategory !== 'all'"
    data-aos="fade-up"
    data-aos-delay="100">
    <div
      *ngFor="let category of filteredCategories"
      class="skill-category-card glass-card">
      
      <!-- Category Header -->
      <div class="category-header">
        <div class="header-left">
          <div class="category-icon-wrapper">
            <i [class]="category.icon" aria-hidden="true"></i>
          </div>
          <div class="category-info">
            <h3 class="category-heading">{{ category.title }}</h3>
          </div>
        </div>
        <span class="skill-count">{{ category.skills.length }} Skills</span>
      </div>

      <!-- Skills Pills Wrap -->
      <div class="skills-pills-wrap">
        <div
          *ngFor="let skill of category.skills"
          class="skill-pill"
          [attr.aria-label]="skill.name">
          <span class="pill-icon-bubble">
            <img
              [src]="skill.icon"
              [alt]="skill.name"
              [class.dark-invert]="skill.invertInDarkMode"
              class="pill-icon"
              width="18"
              height="18"
              loading="lazy" />
          </span>
          <span class="pill-name">{{ skill.name }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Clear Filter Action (Visible when filtered) -->
  <div *ngIf="selectedCategory !== 'all'" class="filter-reset-wrap" data-aos="fade-up">
    <button type="button" class="btn btn-secondary filter-reset-btn" (click)="selectCategory('all')">
      <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
      <span>Show All Categories ({{ totalSkillCount }} Skills)</span>
    </button>
  </div>
</section>
