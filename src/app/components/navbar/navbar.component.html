<header class="navbar-wrapper">
  <nav class="navbar-pill" role="navigation" aria-label="Main Navigation">
    <a href="#hero" class="brand-logo" (click)="closeMobileMenu()">
      <span class="logo-text">SBK</span>
      <span class="logo-dot"></span>
    </a>

    <ul class="nav-links">
      <li><a [class.active]="activeSection === 'hero'" href="#hero" (click)="closeMobileMenu()">Home</a></li>
      <li><a [class.active]="activeSection === 'experience'" href="#experience" (click)="closeMobileMenu()">Experience</a></li>
      <li><a [class.active]="activeSection === 'freelancing'" href="#freelancing" (click)="closeMobileMenu()">Freelance</a></li>
      <li><a [class.active]="activeSection === 'skills'" href="#skills" (click)="closeMobileMenu()">Skills</a></li>
      <li><a [class.active]="activeSection === 'projects'" href="#projects" (click)="closeMobileMenu()">Projects</a></li>
      <li><a [class.active]="activeSection === 'education'" href="#education" (click)="closeMobileMenu()">Education</a></li>
      <li><a [class.active]="activeSection === 'contact'" href="#contact" (click)="closeMobileMenu()">Contact</a></li>
    </ul>

    <div class="nav-actions">
      <div class="status-pill" title="Currently open to new roles & collaborations">
        <span class="pulse-dot" aria-hidden="true"></span>
        <span class="status-text">Available</span>
      </div>

      <button
        class="theme-toggle-btn"
        (click)="toggleTheme()"
        [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
        [title]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
        <span class="theme-icon" aria-hidden="true">{{ isDarkMode ? '🌙' : '☀️' }}</span>
      </button>

      <button
        class="hamburger-btn"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen"
        aria-label="Toggle navigation menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </nav>

  <!-- Mobile Drawer -->
  <div class="mobile-menu-overlay" [class.open]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>
  <div class="mobile-drawer" [class.open]="isMobileMenuOpen">
    <ul class="mobile-nav-links">
      <li><a [class.active]="activeSection === 'hero'" href="#hero" (click)="closeMobileMenu()">Home</a></li>
      <li><a [class.active]="activeSection === 'experience'" href="#experience" (click)="closeMobileMenu()">Experience</a></li>
      <li><a [class.active]="activeSection === 'freelancing'" href="#freelancing" (click)="closeMobileMenu()">Freelance</a></li>
      <li><a [class.active]="activeSection === 'skills'" href="#skills" (click)="closeMobileMenu()">Skills</a></li>
      <li><a [class.active]="activeSection === 'projects'" href="#projects" (click)="closeMobileMenu()">Projects</a></li>
      <li><a [class.active]="activeSection === 'education'" href="#education" (click)="closeMobileMenu()">Education</a></li>
      <li><a [class.active]="activeSection === 'contact'" href="#contact" (click)="closeMobileMenu()">Contact</a></li>
    </ul>
  </div>
</header>
